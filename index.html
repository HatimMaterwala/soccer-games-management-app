<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northside Youth Soccer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Deep pitch-green header band, calm green-tinted paper below,
   one content column (max 1040px), bottom tab bar on phones, top nav on desktop.
   Colors: primary pitch green + secondary kit gold, on tinted neutrals.
   Fonts: Barlow Condensed (display, numbers) + Inter (text). Spacing: 4px grid. */
:root {
  --primary: #0E4D3B;         /* pitch green */
  --primary-band: #0E4D3B;    /* header + hero ground */
  --primary-soft: #E3EFEA;
  --secondary: #E8B03C;       /* kit gold */
  --secondary-soft: #FBF1DB;
  --secondary-ink: #6B4A07;
  --paper: #F5F7F6;
  --surface: #FFFFFF;
  --ink: #13211C;
  --muted: #5A6A64;
  --line: #DCE4E0;
  --on-band: #FFFFFF;
  --on-band-muted: rgba(255,255,255,.72);

  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px; --s20: 80px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #4FB894; --primary-band: #0B3A2D; --primary-soft: #16302A;
    --secondary: #F0BE55; --secondary-soft: #33290F; --secondary-ink: #F3CF7F;
    --paper: #0C1513; --surface: #131F1B; --ink: #E8EFEC; --muted: #93A49D; --line: #24342F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: #4FB894; --primary-band: #0B3A2D; --primary-soft: #16302A;
  --secondary: #F0BE55; --secondary-soft: #33290F; --secondary-ink: #F3CF7F;
  --paper: #0C1513; --surface: #131F1B; --ink: #E8EFEC; --muted: #93A49D; --line: #24342F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-text); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--primary-band); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Header ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--primary-band); color: var(--on-band); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); height: 64px; }
.brand { display: flex; align-items: center; gap: var(--s3); text-decoration: none; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topnav { display: none; gap: var(--s1); }
.topnav a { text-decoration: none; font-size: 14px; font-weight: 500; padding: var(--s2) var(--s3); border-radius: var(--r-sm); color: var(--on-band-muted); }
.topnav a:hover { color: var(--on-band); background: rgba(255,255,255,.08); }
.topnav a[aria-current="page"] { color: var(--on-band); background: rgba(255,255,255,.12); }
.proto-pill { font-size: 12px; font-weight: 600; color: var(--primary-band); background: var(--secondary); padding: var(--s1) var(--s2); border-radius: 999px; white-space: nowrap; }

/* ---------- Bottom tabs (phone) ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: var(--s1) max(8px, env(safe-area-inset-right, 0px)) calc(var(--s1) + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: var(--s1); padding: var(--s2) 0; text-decoration: none; font-size: 12px; font-weight: 500; color: var(--muted); }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--primary); }
main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 820px) {
  .topnav { display: flex; }
  .tabs { display: none; }
  main { padding-bottom: var(--s20); }
}

/* ---------- Page heads ---------- */
.page-head { background: var(--primary-band); color: var(--on-band); }
.page-head .wrap { padding-block: var(--s8) var(--s10); display: flex; flex-direction: column; gap: var(--s2); }
.page-head h1 { font-size: 48px; text-transform: uppercase; }
.page-head p { color: var(--on-band-muted); max-width: 56ch; }
.page-head .eyebrow { color: var(--secondary); }
.section { padding-block: var(--s10) 0; display: flex; flex-direction: column; gap: var(--s5); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); }
.section-title h2 { font-size: 28px; text-transform: uppercase; }
.section-title a { font-size: 14px; font-weight: 600; color: var(--primary); text-decoration: none; }

/* ---------- Home ---------- */
.hero .wrap { padding-block: var(--s10) var(--s12); display: grid; gap: var(--s8); }
.hero h1 { font-size: 56px; text-transform: uppercase; max-width: 12ch; }
.hero h1 span { color: var(--secondary); }
.hero-lede { color: var(--on-band-muted); max-width: 44ch; font-size: 16px; }
.next-up { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: var(--s6); display: grid; gap: var(--s5); box-shadow: 0 24px 48px -24px rgba(0,0,0,.45); }
.next-up-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s4); }
.countdown { text-align: right; flex: none; }
.countdown b { display: block; font-family: var(--font-display); font-size: 48px; line-height: 1; color: var(--primary); }
.countdown small { font-size: 12px; color: var(--muted); }
.matchup { font-family: var(--font-display); font-size: 32px; font-weight: 700; text-transform: uppercase; line-height: 1.05; }
.matchup .vs { color: var(--muted); font-size: 20px; padding: 0 var(--s2); }
.meta-row { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); font-size: 14px; color: var(--muted); }
.meta-row span { display: inline-flex; align-items: center; gap: var(--s2); }
.meta-row svg { width: 16px; height: 16px; color: var(--primary); flex: none; }
@media (min-width: 820px) {
  .hero .wrap { grid-template-columns: 1.1fr 1fr; align-items: center; padding-block: var(--s16); }
  .hero h1 { font-size: 72px; }
}

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s4); }
.stat { padding-block: var(--s2); border-left: 2px solid var(--line); padding-left: var(--s4); display: grid; gap: var(--s1); }
.stat b { font-family: var(--font-display); font-size: 40px; line-height: 1; }
.stat span { font-size: 14px; color: var(--muted); }
@media (min-width: 820px) { .stats { grid-template-columns: repeat(4, 1fr); } }

.news { display: grid; gap: var(--s3); }
.news-item { display: grid; grid-template-columns: 56px 1fr; gap: var(--s4); padding: var(--s5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.news-date { text-align: center; padding-top: var(--s1); }
.news-date b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1; }
.news-date small { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.news-item h3 { font-family: var(--font-text); font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: var(--s1); }
.news-item p { font-size: 14px; color: var(--muted); }
.news-item.pinned { border-color: var(--secondary); background: var(--secondary-soft); }
.tag { display: inline-flex; align-items: center; gap: var(--s1); font-size: 12px; font-weight: 600; padding: 2px var(--s2); border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
.tag.gold { background: var(--secondary-soft); color: var(--secondary-ink); }
.pinned .tag.gold { background: var(--surface); }

.team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s3); }
.team-tile { display: grid; gap: var(--s2); padding: var(--s5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); text-decoration: none; transition: border-color .15s; }
.team-tile:hover { border-color: var(--primary); }
.team-tile .age { font-family: var(--font-display); font-size: 32px; line-height: 1; color: var(--primary); }
.team-tile strong { font-size: 16px; }
.team-tile span { font-size: 14px; color: var(--muted); }
@media (min-width: 820px) { .team-grid { grid-template-columns: repeat(4, 1fr); } }

/* ---------- Chips / filters ---------- */
.chips { display: flex; gap: var(--s2); overflow-x: auto; padding-bottom: var(--s1); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: var(--s2) var(--s4); border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--primary); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--surface); }

/* ---------- Schedule ---------- */
.day { display: grid; gap: var(--s3); }
.day-head { display: flex; align-items: baseline; gap: var(--s3); padding-top: var(--s4); }
.day-head h3 { font-size: 24px; text-transform: uppercase; }
.day-head span { font-size: 14px; color: var(--muted); }
.event { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: var(--s4); padding: var(--s4) var(--s5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.event.game { border-left: 4px solid var(--secondary); }
.event-time { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.event-time small { display: block; font-family: var(--font-text); font-size: 12px; color: var(--muted); font-weight: 500; }
.event-body { min-width: 0; display: grid; gap: var(--s1); }
.event-body strong { font-size: 16px; font-weight: 600; }
.event-body span { font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { .event { grid-template-columns: 60px 1fr; } .event .tag { grid-column: 2; justify-self: start; } }

/* ---------- Roster ---------- */
.coach-strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s4); padding: var(--s5); background: var(--primary-soft); border-radius: var(--r-md); }
.coach-strip div { display: grid; gap: var(--s1); }
.coach-strip strong { font-size: 16px; }
.coach-strip span { font-size: 14px; color: var(--muted); }
.roster { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.player-row { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: var(--s4); padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }
.player-row:first-child { border-top: 0; }
.jersey { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--primary); text-align: center; line-height: 1; }
.player-row div { display: grid; min-width: 0; }
.player-row strong { font-weight: 600; font-size: 16px; }
.player-row span { font-size: 14px; color: var(--muted); }
.pos { font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: var(--s1) var(--s2); border-radius: var(--r-sm); background: var(--paper); color: var(--muted); min-width: 44px; text-align: center; }

/* ---------- Payments ---------- */
.gate { max-width: 400px; margin: var(--s12) auto 0; padding: var(--s8); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); display: grid; gap: var(--s5); }
.gate h2 { font-size: 32px; text-transform: uppercase; }
.gate p { font-size: 14px; color: var(--muted); }
.field { display: grid; gap: var(--s2); }
.field label { font-size: 14px; font-weight: 600; }
.input { width: 100%; height: 48px; padding: 0 var(--s4); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); font: inherit; color: var(--ink); }
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.btn { height: 48px; padding: 0 var(--s6); border: 0; border-radius: var(--r-sm); background: var(--primary); color: var(--surface); font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--line); height: 40px; padding: 0 var(--s4); font-size: 14px; }
.error { font-size: 14px; color: #B3261E; }
.hint { font-size: 12px; color: var(--muted); padding: var(--s3); background: var(--paper); border-radius: var(--r-sm); }

.money { display: grid; gap: var(--s6); padding: var(--s6); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.money-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--s4); }
.money-top b { font-family: var(--font-display); font-size: 56px; line-height: 1; }
.money-top b small { font-size: 24px; color: var(--muted); font-weight: 600; }
.bar { height: 12px; border-radius: 999px; background: var(--paper); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .paid { background: var(--primary); }
.bar .part { background: var(--secondary); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s6); font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: var(--s2); }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }
.toolbar .input { height: 40px; flex: 1 1 200px; font-size: 14px; }
.pay-table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
td { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td strong { font-weight: 600; }
.status { display: inline-flex; align-items: center; gap: var(--s2); font-size: 12px; font-weight: 600; padding: var(--s1) var(--s3); border-radius: 999px; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.paid { background: var(--primary-soft); color: var(--primary); }
.status.partial { background: var(--secondary-soft); color: var(--secondary-ink); }
.status.unpaid { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.mark-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: var(--s1) var(--s3); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--primary); white-space: nowrap; }
.mark-btn:hover { border-color: var(--primary); }

/* ---------- Player cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--s4); }
.pcard { position: relative; min-height: 280px; max-width: 100%; border-radius: var(--r-lg); padding: var(--s4); color: #fff; overflow: hidden;
  background: radial-gradient(120% 80% at 100% 0%, rgba(232,176,60,.35), transparent 55%), linear-gradient(160deg, #146A51, #0B3A2D 70%);
  display: flex; flex-direction: column; box-shadow: 0 16px 32px -20px rgba(0,0,0,.6); }
.pcard.elite { background: radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,.35), transparent 55%), linear-gradient(160deg, #F2C462, #B9832A 75%); color: #241A05; }
.pcard::after { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(255,255,255,.22); border-radius: 12px; pointer-events: none; }
.pcard.elite::after { border-color: rgba(36,26,5,.25); }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; }
.pc-ovr { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: .9; }
.pc-pos { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .06em; opacity: .85; }
.pc-team { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; text-align: right; }
.pc-avatar { margin: var(--s2) auto var(--s3); width: 48%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 32px; font-weight: 700; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); }
.pcard.elite .pc-avatar { background: rgba(36,26,5,.08); border-color: rgba(36,26,5,.3); }
.pc-name { margin-top: auto; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: uppercase; line-height: 1.1; padding-bottom: var(--s2); border-bottom: 1px solid rgba(255,255,255,.22); }
.pcard.elite .pc-name { border-color: rgba(36,26,5,.25); }
.pc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--s2); padding-top: var(--s2); font-size: 12px; }
.pc-stats div { display: flex; justify-content: space-between; gap: var(--s1); }
.pc-stats b { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.pc-stats span { opacity: .8; font-weight: 500; }
@media (min-width: 820px) { .cards { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

.empty { padding: var(--s10) var(--s6); text-align: center; color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-md); }
.footnote { padding-block: var(--s12) 0; font-size: 12px; color: var(--muted); max-width: 64ch; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Northside Youth Soccer home">
      <svg width="36" height="40" viewBox="0 0 36 40" aria-hidden="true">
        <path d="M18 1 L34 6 V20 C34 30 27 36 18 39 C9 36 2 30 2 20 V6 Z" fill="#E8B03C"/>
        <path d="M18 5 L30 9 V20 C30 27.5 25 32 18 34.6 C11 32 6 27.5 6 20 V9 Z" fill="#0E4D3B"/>
        <circle cx="18" cy="20" r="7" fill="#FFFFFF"/>
        <path d="M18 15.6 l3.2 2.3 -1.2 3.8 h-4 l-1.2 -3.8 Z" fill="#0E4D3B"/>
      </svg>
      <span class="brand-name">Northside Youth Soccer</span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="#home">Home</a><a href="#schedule">Schedule</a><a href="#roster">Roster</a><a href="#payments">Payments</a><a href="#cards">Player Cards</a>
    </nav>
    <span class="proto-pill" title="Sample data for review">Prototype</span>
  </div>
</header>

<main id="app"></main>

<nav class="tabs" aria-label="Main">
  <a href="#home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</a>
  <a href="#roster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.4 4.6 4"/></svg>Roster</a>
  <a href="#payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6.5 15h3"/></svg>Payments</a>
  <a href="#cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><circle cx="12" cy="10" r="3"/><path d="M8.5 17h7"/></svg>Cards</a>
</nav>

<script>
(() => {
  /* ---------------- Sample data (all placeholders) ---------------- */
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const between = (lo, hi) => Math.round(lo + rnd() * (hi - lo));

  const TEAMS = [
    { id: 'u8',  age: 'U8',  name: 'Falcons',  coach: 'Coach Amina R.',  phone: '(555) 201-4410', ages: [6,7],   practice: [[2,'5:30 PM','Field 1']],                      color: 'Gold'  },
    { id: 'u10', age: 'U10', name: 'Lions',    coach: 'Coach Daniel K.', phone: '(555) 201-4422', ages: [8,9],   practice: [[2,'6:00 PM','Field 2'],[4,'6:00 PM','Field 2']], color: 'Green' },
    { id: 'u12', age: 'U12', name: 'Strikers', coach: 'Coach Sofia M.',  phone: '(555) 201-4437', ages: [10,11], practice: [[1,'6:00 PM','Field 3'],[3,'6:00 PM','Field 3']], color: 'White' },
    { id: 'u14', age: 'U14', name: 'Thunder',  coach: 'Coach Omar H.',   phone: '(555) 201-4459', ages: [12,13], practice: [[3,'7:00 PM','Field 1'],[5,'6:30 PM','Field 1']], color: 'Black' },
  ];
  const team = id => TEAMS.find(t => t.id === id);
  const FIRST = ['Aaliyah','Ben','Carlos','Dina','Elias','Fatima','Gabe','Hana','Isaac','Jada','Kofi','Leila','Mateo','Nora','Owen','Priya','Quinn','Rami','Sara','Theo','Uma','Victor','Wren','Yusuf','Zara','Adam','Bella','Caleb','Dev','Emma','Farah','Grant','Hugo','Iris','Jonah','Kai','Luca','Maya','Noah','Olivia','Pablo','Ruby','Sami','Tess','Ali','Bilal','Chloe','Diego','Eva','Finn','Grace','Hassan','Ivy','Jamal','Kira','Liam','Mila','Nate','Omar','Rosa'];
  const LAST = ['Ahmed','Brooks','Castillo','Diallo','Evans','Farah','Garcia','Hussein','Ito','Johnson','Khan','Lopez','Mensah','Nguyen','Okafor','Patel','Reyes','Silva','Turner','Walker','Yilmaz','Kim','Bauer','Moreno'];
  const POS = ['GK','DEF','DEF','DEF','DEF','MID','MID','MID','MID','FWD','FWD','FWD','DEF','MID','FWD'];
  const FEE = 150;

  const PLAYERS = [];
  TEAMS.forEach((t, ti) => {
    const used = new Set();
    for (let i = 0; i < 15; i++) {
      const first = FIRST[ti * 15 + i];
      const last = pick(LAST);
      let n; do { n = between(1, 30); } while (used.has(n)); used.add(n);
      const pos = POS[i];
      const base = { u8: 52, u10: 58, u12: 63, u14: 68 }[t.id];
      const r = () => Math.min(97, between(base - 8, base + 22));
      const s = { SPD: r(), SHO: r(), PAS: r(), DRI: r(), DEF: r(), TEM: r() };
      if (pos === 'FWD') s.SHO = Math.min(97, s.SHO + 8);
      if (pos === 'DEF' || pos === 'GK') s.DEF = Math.min(97, s.DEF + 10);
      if (pos === 'MID') s.PAS = Math.min(97, s.PAS + 8);
      const ovr = Math.round(Object.values(s).reduce((a, b) => a + b, 0) / 6);
      const roll = rnd();
      const paid = roll < .68 ? FEE : roll < .84 ? 75 : 0;
      PLAYERS.push({ id: `${t.id}-${i}`, first, last, team: t.id, num: n, pos, age: pick(t.ages), stats: s, ovr, paid,
        guardian: `${pick(['Ms.','Mr.'])} ${last}`, paidOn: paid ? `Nov ${between(1, 19)}` : '' });
    }
  });

  const DAY = 864e5;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const OPP = ['Riverside FC','Eastgate United','Maple Park SC','Lakeview Rovers','Hillcrest Athletic','Westend Wolves'];
  const EVENTS = [];
  for (let d = 0; d < 21; d++) {
    const date = new Date(today.getTime() + d * DAY);
    const dow = date.getDay();
    TEAMS.forEach((t, ti) => {
      t.practice.forEach(([pd, time, field]) => { if (pd === dow) EVENTS.push({ date, time, team: t.id, kind: 'practice', title: `${t.name} practice`, where: `Northside Park, ${field}` }); });
      if (dow === 6) {
        const home = (d + ti) % 2 === 0;
        EVENTS.push({ date, time: ['9:00 AM','10:30 AM','12:00 PM','1:30 PM'][ti], team: t.id, kind: 'game', opp: OPP[(d + ti) % OPP.length], home,
          title: `${t.name} ${home ? 'vs' : 'at'} ${OPP[(d + ti) % OPP.length]}`, where: home ? `Northside Park, Field ${ti + 1}` : `${OPP[(d + ti) % OPP.length].split(' ')[0]} Fields` });
      }
    });
  }
  const toMin = t => { const [hm, ap] = t.split(' '); let [h, m] = hm.split(':').map(Number); if (ap === 'PM' && h !== 12) h += 12; return h * 60 + m; };
  EVENTS.sort((a, b) => a.date - b.date || toMin(a.time) - toMin(b.time));

  const ago = n => new Date(today.getTime() - n * DAY);
  const NEWS = [
    { date: ago(0), pinned: true, tag: 'Important', title: 'Picture day is this Saturday', body: 'Arrive 20 minutes before your game in full uniform. Team and individual photos will be taken by the snack stand.' },
    { date: ago(2), tag: 'Payments', title: 'Season fee reminder', body: `The ${'$'}${FEE} season fee covers uniform, field rental and referees. Pay any coach in person or by the usual payment link.` },
    { date: ago(5), tag: 'Fields', title: 'Field 3 lights fixed', body: 'U12 Strikers practices are back on Field 3 starting this week.' },
  ];

  /* ---------------- Helpers ---------------- */
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dayLabel = d => { const diff = Math.round((d - today) / DAY); return diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : DOW[d.getDay()]; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = n => '$' + n.toLocaleString();
  const ICON = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    shirt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.7-2 3-4 3s-3.5-1.3-4-3z"/></svg>',
  };
  const state = { schedTeam: 'all', rosterTeam: 'u10', cardTeam: 'all', payFilter: 'all', paySearch: '', coach: false };
  try { state.coach = sessionStorage.getItem('nys-coach') === '1'; } catch (e) {}

  const pageHead = (eyebrow, title, lede) => `<section class="page-head"><div class="wrap"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${lede ? `<p>${lede}</p>` : ''}</div></section>`;
  const teamChips = (key, withAll) => `<div class="chips" role="group" aria-label="Choose team">${withAll ? `<button class="chip" data-chip="${key}" data-val="all" aria-pressed="${state[key] === 'all'}">All teams</button>` : ''}${TEAMS.map(t => `<button class="chip" data-chip="${key}" data-val="${t.id}" aria-pressed="${state[key] === t.id}">${t.age} ${t.name}</button>`).join('')}</div>`;

  /* ---------------- Views ---------------- */
  function viewHome() {
    const next = EVENTS.find(e => e.kind === 'game') ;
    const t = team(next.team);
    const days = Math.round((next.date - today) / DAY);
    const games = EVENTS.filter(e => e.kind === 'game').length;
    const paidCount = PLAYERS.filter(p => p.paid >= FEE).length;
    return `
    <section class="page-head hero"><div class="wrap">
      <div style="display:grid;gap:16px">
        <span class="eyebrow">Fall season 2026</span>
        <h1>Every game, every practice, <span>one place.</span></h1>
        <p class="hero-lede">Schedules, rosters and team news for all ${PLAYERS.length} players across ${TEAMS.length} age groups. Bookmark this page on your phone.</p>
      </div>
      <article class="next-up" aria-label="Next game">
        <div class="next-up-top">
          <div style="display:grid;gap:8px"><span class="eyebrow">Next game · ${t.age}</span>
            <div class="matchup">${t.name}<span class="vs">${next.home ? 'vs' : 'at'}</span>${esc(next.opp)}</div></div>
          <div class="countdown num">${days === 0 ? '<b>Today</b><small>kickoff</small>' : `<b>${days}</b><small>${days === 1 ? 'day' : 'days'} away</small>`}</div>
        </div>
        <div class="meta-row">
          <span>${ICON.clock}${dayLabel(next.date)}, ${MON[next.date.getMonth()]} ${next.date.getDate()} · ${next.time}</span>
          <span>${ICON.pin}${esc(next.where)}</span>
          <span>${ICON.shirt}${next.home ? 'Home kit' : 'Away kit'}</span>
        </div>
        <a class="btn" href="#schedule" style="display:grid;place-items:center;text-decoration:none">See full schedule</a>
      </article>
    </div></section>

    <div class="wrap">
      <section class="section">
        <div class="stats num">
          <div class="stat"><b>${PLAYERS.length}</b><span>Players</span></div>
          <div class="stat"><b>${TEAMS.length}</b><span>Teams, U8 to U14</span></div>
          <div class="stat"><b>${games}</b><span>Games in the next 3 weeks</span></div>
          <div class="stat"><b>${Math.round(paidCount / PLAYERS.length * 100)}%</b><span>Season fees paid</span></div>
        </div>
      </section>

      <section class="section">
        <div class="section-title"><h2>Announcements</h2></div>
        <div class="news">${NEWS.map(n => `
          <article class="news-item${n.pinned ? ' pinned' : ''}">
            <div class="news-date num"><small>${MON[n.date.getMonth()]}</small><b>${n.date.getDate()}</b></div>
            <div><span class="tag${n.pinned ? ' gold' : ''}">${n.tag}</span><h3 style="margin-top:8px">${n.title}</h3><p>${n.body}</p></div>
          </article>`).join('')}
        </div>
      </section>

      <section class="section">
        <div class="section-title"><h2>Teams</h2><a href="#roster">All rosters</a></div>
        <div class="team-grid">${TEAMS.map(t => `
          <a class="team-tile" href="#roster" data-team="${t.id}"><span class="age">${t.age}</span><strong>${t.name}</strong><span>${t.coach}</span></a>`).join('')}
        </div>
      </section>
      <p class="footnote">Prototype for review. The league name, teams, coaches, players, dates and amounts are all sample placeholders.</p>
    </div>`;
  }

  function viewSchedule() {
    const list = EVENTS.filter(e => state.schedTeam === 'all' || e.team === state.schedTeam);
    const byDay = [];
    list.forEach(e => { const k = e.date.getTime(); let g = byDay.find(x => x.k === k); if (!g) byDay.push(g = { k, date: e.date, items: [] }); g.items.push(e); });
    return pageHead('Next 3 weeks', 'Schedule', 'Practices and games for every team. Games are marked in gold.') + `
    <div class="wrap"><section class="section">
      ${teamChips('schedTeam', true)}
      <div style="display:grid;gap:8px">${byDay.length ? byDay.map(g => `
        <div class="day">
          <div class="day-head"><h3>${dayLabel(g.date)}</h3><span class="num">${MON[g.date.getMonth()]} ${g.date.getDate()}</span></div>
          ${g.items.map(e => { const t = team(e.team); const [hm, ap] = e.time.split(' '); return `
          <div class="event${e.kind === 'game' ? ' game' : ''}">
            <div class="event-time num">${hm}<small>${ap}</small></div>
            <div class="event-body"><strong>${esc(e.title)}</strong><span>${t.age} · ${esc(e.where)}</span></div>
            <span class="tag${e.kind === 'game' ? ' gold' : ''}">${e.kind === 'game' ? 'Game' : 'Practice'}</span>
          </div>`; }).join('')}
        </div>`).join('') : '<div class="empty">No events in the next 3 weeks.</div>'}
      </div>
    </section></div>`;
  }

  function viewRoster() {
    const t = team(state.rosterTeam);
    const order = { GK: 0, DEF: 1, MID: 2, FWD: 3 };
    const list = PLAYERS.filter(p => p.team === t.id).sort((a, b) => order[a.pos] - order[b.pos] || a.num - b.num);
    return pageHead('Fall season 2026', 'Roster', `${PLAYERS.length} players across ${TEAMS.length} teams.`) + `
    <div class="wrap"><section class="section">
      ${teamChips('rosterTeam', false)}
      <div class="coach-strip">
        <div><span class="eyebrow">Head coach</span><strong>${t.coach}</strong><span class="num">${t.phone}</span></div>
        <div><span class="eyebrow">Practice</span><strong>${t.practice.map(([d, tm]) => DOW[d].slice(0, 3) + ' ' + tm).join(' & ')}</strong><span>${t.practice[0][2]}, Northside Park</span></div>
      </div>
      <div class="roster">${list.map(p => `
        <div class="player-row"><span class="jersey num">${p.num}</span><div><strong>${p.first} ${p.last}</strong><span>Age ${p.age}</span></div><span class="pos">${p.pos}</span></div>`).join('')}
      </div>
    </section></div>`;
  }

  function viewPayments() {
    if (!state.coach) return pageHead('Coaches only', 'Payments', 'Track season fees for every player.') + `
    <div class="wrap"><form class="gate" id="gate" novalidate>
      <h2>Coach sign in</h2>
      <p>Parents can't see this page. Enter the coach password to view and update payments.</p>
      <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Coach password"></div>
      <p class="error" id="pwerr" hidden>That password didn't match. Try again.</p>
      <button class="btn" type="submit">Sign in</button>
      <p class="hint">Prototype only: the password is <strong>coach</strong>. A real version would use proper accounts.</p>
    </form></div>`;

    const total = PLAYERS.length * FEE;
    const collected = PLAYERS.reduce((a, p) => a + p.paid, 0);
    const full = PLAYERS.filter(p => p.paid >= FEE).length;
    const part = PLAYERS.filter(p => p.paid > 0 && p.paid < FEE).length;
    const none = PLAYERS.length - full - part;
    const statusOf = p => p.paid >= FEE ? 'paid' : p.paid > 0 ? 'partial' : 'unpaid';
    const q = state.paySearch.toLowerCase();
    const rows = PLAYERS.filter(p => (state.payFilter === 'all' || statusOf(p) === state.payFilter) && (!q || `${p.first} ${p.last}`.toLowerCase().includes(q)))
      .sort((a, b) => a.paid - b.paid || a.last.localeCompare(b.last));
    const partPaid = PLAYERS.filter(p => p.paid > 0 && p.paid < FEE).reduce((a, p) => a + p.paid, 0);
    const filt = [['all', 'Everyone'], ['unpaid', `Not paid (${none})`], ['partial', `Partly paid (${part})`], ['paid', `Paid (${full})`]];
    return pageHead('Coaches only', 'Payments', `Season fee is ${money(FEE)} per player.`) + `
    <div class="wrap"><section class="section">
      <div class="money">
        <div class="money-top">
          <div style="display:grid;gap:4px"><span class="eyebrow">Collected</span><b class="num">${money(collected)} <small>of ${money(total)}</small></b></div>
          <div style="display:grid;gap:4px;text-align:right"><span class="eyebrow">Still owed</span><b class="num" style="font-size:32px;color:var(--secondary-ink)">${money(total - collected)}</b></div>
        </div>
        <div class="bar" role="img" aria-label="${Math.round(collected / total * 100)} percent collected"><i class="paid" style="width:${(full * FEE) / total * 100}%"></i><i class="part" style="width:${partPaid / total * 100}%"></i></div>
        <div class="legend num">
          <span><i style="background:var(--primary)"></i>${full} paid in full</span>
          <span><i style="background:var(--secondary)"></i>${part} partly paid</span>
          <span><i style="background:var(--paper);border:1px solid var(--line)"></i>${none} not paid</span>
        </div>
      </div>
      <div class="toolbar">
        <input class="input" id="paysearch" type="search" placeholder="Search players" value="${esc(state.paySearch)}" aria-label="Search players">
        <button class="btn ghost" id="signout" type="button">Sign out</button>
      </div>
      <div class="chips" role="group" aria-label="Filter by status">${filt.map(([v, l]) => `<button class="chip" data-chip="payFilter" data-val="${v}" aria-pressed="${state.payFilter === v}">${l}</button>`).join('')}</div>
      <div class="pay-table-wrap"><table>
        <thead><tr><th>Player</th><th>Team</th><th>Status</th><th class="r">Paid</th><th class="r">Owes</th><th class="r"><span class="eyebrow" style="font-size:12px">Action</span></th></tr></thead>
        <tbody>${rows.map(p => { const t = team(p.team); const s = statusOf(p); return `
          <tr><td><strong>${p.first} ${p.last}</strong><br><span style="color:var(--muted);font-size:12px">${p.guardian}</span></td>
            <td>${t.age} ${t.name}</td>
            <td><span class="status ${s}">${s === 'paid' ? 'Paid' : s === 'partial' ? 'Partly paid' : 'Not paid'}</span></td>
            <td class="r num">${money(p.paid)}</td>
            <td class="r num">${p.paid >= FEE ? '—' : money(FEE - p.paid)}</td>
            <td class="r">${p.paid >= FEE ? `<button class="mark-btn" data-undo="${p.id}" style="color:var(--muted)">Undo</button>` : `<button class="mark-btn" data-pay="${p.id}">Mark paid</button>`}</td></tr>`; }).join('') || `<tr><td colspan="6"><div class="empty" style="border:0">No players match.</div></td></tr>`}
        </tbody></table></div>
      <p class="footnote">Changes here are only for this demo and reset when the page reloads.</p>
    </section></div>`;
  }

  function viewCards() {
    const list = PLAYERS.filter(p => state.cardTeam === 'all' || p.team === state.cardTeam).sort((a, b) => b.ovr - a.ovr);
    const L = { SPD: 'Speed', SHO: 'Shoot', PAS: 'Pass', DRI: 'Dribble', DEF: 'Defend', TEM: 'Team' };
    return pageHead('Just for fun', 'Player Cards', 'Coach ratings out of 99. Gold cards go to players rated 75 and up.') + `
    <div class="wrap"><section class="section">
      ${teamChips('cardTeam', true)}
      <div class="cards">${list.map(p => { const t = team(p.team); return `
        <article class="pcard${p.ovr >= 75 ? ' elite' : ''}" aria-label="${p.first} ${p.last}, rated ${p.ovr}">
          <div class="pc-top"><div><div class="pc-ovr num">${p.ovr}</div><div class="pc-pos">${p.pos}</div></div><div class="pc-team">${t.age}<br>${t.name}<br>#${p.num}</div></div>
          <div class="pc-avatar">${p.first[0]}${p.last[0]}</div>
          <div class="pc-name">${p.first}<br>${p.last}</div>
          <div class="pc-stats num">${Object.entries(p.stats).map(([k, v]) => `<div><span>${L[k]}</span><b>${v}</b></div>`).join('')}</div>
        </article>`; }).join('')}
      </div>
    </section></div>`;
  }

  /* ---------------- Router ---------------- */
  const VIEWS = { home: viewHome, schedule: viewSchedule, roster: viewRoster, payments: viewPayments, cards: viewCards };
  function route(keepScroll) {
    const key = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
    const y = window.scrollY;
    app.innerHTML = VIEWS[key]();
    document.querySelectorAll('.topnav a, .tabs a').forEach(a => a.getAttribute('href') === '#' + key ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    window.scrollTo(0, keepScroll ? y : 0);
  }
  window.addEventListener('hashchange', () => route(false));

  app.addEventListener('click', e => {
    const chip = e.target.closest('[data-chip]');
    if (chip) { state[chip.dataset.chip] = chip.dataset.val; route(true); return; }
    const tile = e.target.closest('[data-team]');
    if (tile) state.rosterTeam = tile.dataset.team;
    const pay = e.target.closest('[data-pay]');
    if (pay) { PLAYERS.find(p => p.id === pay.dataset.pay).paid = FEE; route(true); return; }
    const undo = e.target.closest('[data-undo]');
    if (undo) { PLAYERS.find(p => p.id === undo.dataset.undo).paid = 0; route(true); return; }
    if (e.target.id === 'signout') { state.coach = false; try { sessionStorage.removeItem('nys-coach'); } catch (err) {} route(false); }
  });
  app.addEventListener('submit', e => {
    if (e.target.id !== 'gate') return;
    e.preventDefault();
    if ($('#pw').value.trim().toLowerCase() === 'coach') { state.coach = true; try { sessionStorage.setItem('nys-coach', '1'); } catch (err) {} route(false); }
    else { $('#pwerr').hidden = false; $('#pw').select(); }
  });
  app.addEventListener('input', e => {
    if (e.target.id !== 'paysearch') return;
    state.paySearch = e.target.value;
    const pos = e.target.selectionStart;
    route(true);
    const el = $('#paysearch'); el.focus(); el.setSelectionRange(pos, pos);
  });

  route(false);
})();
</script>
</body>
</html>
